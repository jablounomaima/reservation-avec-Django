<!-- templates/appointments/login.html -->
{% extends 'appointments/base.html' %}
{% load socialaccount %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <h2 class="text-center mb-4">Connexion</h2>

      <!-- Formulaire de connexion -->
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_login" class="form-label">Adresse e-mail</label>
          <input type="text" name="login" id="id_login" class="form-control"
                 autofocus autocapitalize="none" autocomplete="email" maxlength="150" required>
        </div>

        <div class="mb-3">
          <label for="id_password" class="form-label">Mot de passe</label>
          <input type="password" name="password" id="id_password" class="form-control"
                 autocomplete="current-password" required>
        </div>

        <a href="{% url 'account_login' %}">Se connecter</a>
      </form>

      <!-- Liens -->
      <div class="text-center mt-3">
        <p><a href="{% url 'password_reset' %}">Mot de passe oublié ?</a></p>
        <p>Pas encore inscrit ? <a href="{% url 'appointments:register' %}">Créer un compte</a></p>
      </div>

      <hr>

      <!-- Connexion avec Google -->
      <h5 class="text-center mb-3">Ou se connecter avec</h5>
      <a href="{}" class="btn btn-danger w-100">
        <i class="fab fa-google me-2"></i> Se connecter avec Google
      </a>

    </div>
  </div>
</div>
{% endblock %}
