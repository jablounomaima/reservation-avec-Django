<!-- templates/account/password_reset_from_key.html -->
{% extends "account/base2.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>Réinitialiser le mot de passe</h2>

      {% if form.errors %}
        <div class="alert alert-danger">
          {{ form.non_field_errors }}
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
          <label for="{{ form.password1.id_for_label }}" class="form-label">Nouveau mot de passe</label>
          {{ form.password1 }}
        </div>

        <div class="mb-3">
          <label for="{{ form.password2.id_for_label }}" class="form-label">Confirmer le mot de passe</label>
          {{ form.password2 }}
        </div>

        <button type="submit" class="btn btn-success">Changer le mot de passe</button>
      </form>

      <hr>
      <p><a href="/">← Retour à l'accueil</a></p>
    </div>
  </div>
</div>
{% endblock %}
