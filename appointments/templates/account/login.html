<!-- templates/account/login.html -->
{% extends 'account/base2.html' %}
{% load static %}

{% block content %}
<style>
        
        
    .container2 {
        max-width: 500px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
        color: #2c7be5;
        margin-bottom: 30px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
        box-sizing: border-box;
    }
    button {
        width: 100%;
        padding: 12px;
        background-color: #2c7be5;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }
    button:hover {
        background-color: #1a68d1;
    }
    .login-link {
        text-align: center;
        margin-top: 20px;
    }
    .login-link a {
        color: #2c7be5;
        text-decoration: none;
    }
    .login-link a:hover {
        text-decoration: underline;
    }
    .errorlist {
        color: #d63031;
        font-size: 14px;
        margin: 5px 0;
    }
    .success {
        color: #00b894;
        font-weight: bold;
    }
    </style>

<div class="container2">
<h2>Connexion</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Se connecter</button>
</form>

<p><a href="{% url 'account_reset_password' %}">Mot de passe oublié ?</a></p>
<p>Pas encore inscrit ? <a href="{% url 'account_signup' %}">Créer un compte</a></p>
</div>

{% endblock %}
